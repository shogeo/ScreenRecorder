name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Compile Release x64
        run: dotnet build Recording.csproj -c Release -p:Platform=x64 -p:RestoreLockedMode=true --nologo
      # No recording tests: hosted runners have no intended capture session or NVENC GPU.
